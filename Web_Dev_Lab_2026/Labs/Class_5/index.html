<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./script.js" defer></script>
</head>
<body>
    <div style="display: flex;flex-direction: column;gap: 10px;justify-content: center;align-items: center;height: 100vh;">
        <h1>Simple Calculator</h1>
        <div>
            <label for="inputOne">First Input</label>
            <Input type="number" required placeholder="Enter Number One" id="inputOne"></Input>
        </div>
        <div>
            <label for="secondOne">Second Input</label>
            <Input type="number" required placeholder="Enter Number Two" id="secondOne"></Input>
        </div>
        <div>
            <button id="a" style="padding: 7px">Add</button>
            <button id="s" style="padding: 7px">Substract</button>
            <button id="p" style="padding: 7px">Product</button>
            <button id="d" style="padding: 7px">Divide</button>
        </div>
        <div>
            <button style="padding: 10px">Calculate</button>
        </div>
        <div>
            <p>Output is : <span id="output"></span></p>
        </div>
    </div>
</body>
</html>
